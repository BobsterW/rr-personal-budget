name: Deploy production
on:
  push:
    branches: [main]
permissions:
  contents: read
  deployments: write
concurrency:
  group: production
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  deploy-api:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Configure production frontend origin
        run: >-
          node -e "const fs=require('fs');const file='worker/wrangler.jsonc';
          fs.writeFileSync(file,fs.readFileSync(file,'utf8').replace(
          'http://localhost:8788,http://127.0.0.1:8788',process.env.FRONTEND_ORIGIN))"
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      - name: Apply D1 migrations
        working-directory: worker
        run: pnpm exec wrangler d1 migrations apply rr-budget --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  deploy-frontend:
    needs: [validate, deploy-api]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Configure production API URL
        run: >-
          node -e "require('fs').writeFileSync('frontend/src/config.js',
          'window.APP_CONFIG = { API_BASE_URL: ' + JSON.stringify(process.env.API_URL) + ' };\n')"
        env:
          API_URL: ${{ vars.WORKER_API_URL }}
      - run: pnpm --filter @rr-budget/frontend build
      - name: Deploy Pages
        run: >-
          pnpm --dir worker exec wrangler pages deploy ../frontend/dist
          --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
